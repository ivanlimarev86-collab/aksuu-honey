<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ak-Suu</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0d0b">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d0b;--bg2:#101512;--bg3:#161d18;--fg:#ece4d1;--fg2:#b9ad93;--fg3:#8a806a;--line:rgba(201,169,97,.22);--gold:#c9a961;--gold2:#e3c57e;--ink:#0a0d0b;--red:#d98a6a;
--serif:'Cormorant',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{padding:0 18px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;font-variant-numeric:lining-nums}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.top b{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.18em}
.top span{font-size:9.500px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg3)}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:500;margin:30px 0 12px}
.row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.ico{display:flex;align-items:flex-end;justify-content:center;height:54px;color:var(--gold)}
.ico svg{display:block;fill:none;stroke:currentColor;stroke-width:1.300}
.row .sz{font-family:var(--serif);font-size:30px;line-height:1;font-variant-numeric:lining-nums;white-space:nowrap}
.row .nt{font-size:10.500px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);margin-top:5px}
.row .pr{font-family:var(--serif);font-size:20px;color:var(--gold2);margin-top:4px;font-variant-numeric:lining-nums}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line)}
.step button{width:44px;height:44px;background:none;border:0;color:var(--gold);font-size:22px;line-height:1;font-family:var(--sans);cursor:pointer}
.step button:active{background:var(--bg3)}
.step button:disabled{color:var(--fg3);opacity:.45}
.step output{min-width:30px;text-align:center;font-family:var(--serif);font-size:24px;font-variant-numeric:lining-nums}
.row.on{background:linear-gradient(90deg,rgba(201,169,97,.07),rgba(201,169,97,0))}
.minis{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;color:var(--gold);min-height:0}
.minis:empty{display:none}
.minis svg{width:15px;height:19px;fill:currentColor;fill-opacity:.9;stroke:none}
.note{font-family:var(--mono);font-size:10.500px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);line-height:1.6;margin:16px 0 0}
label{display:block;font-size:10.500px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);margin:20px 0 8px}
input,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:16px;padding:14px;border-radius:0;outline:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--gold)}
input.bad,textarea.bad{border-color:var(--red)}
textarea{min-height:76px;resize:none}
.pm{display:grid;gap:8px}
.pm button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0 16px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.pm button::after{content:"";width:12px;height:12px;border-radius:50%;border:1px solid var(--gold);flex:none}
.pm button.on{border-color:var(--gold)}
.pm button.on::after{background:var(--gold)}
.sum{border-top:1px solid var(--line);margin-top:26px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:20px;font-variant-numeric:lining-nums}
.sum div.t{font-size:26px;color:var(--gold2)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(10,13,11,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar .tt{flex:1;min-width:0}
.bar .tt span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3)}
.bar .tt b{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;color:var(--fg);font-variant-numeric:lining-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border:0;background:var(--gold);color:var(--ink);font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn:disabled{background:rgba(201,169,97,.25);color:var(--fg3)}
.btn.line{background:none;border:1px solid var(--gold);color:var(--gold)}
.back{background:none;border:0;color:var(--fg2);font:inherit;font-size:13px;letter-spacing:.04em;padding:16px 0 0;cursor:pointer}
[hidden]{display:none!important}
html[lang="ru"] .en,html[lang="en"] .ru{display:none!important}
</style>

<div class="top"><b>AK-SUU</b><span><span class="ru">Урожай 2026</span><span class="en">Harvest 2026</span></span></div>

<main id="s1">
  <p class="eyebrow"><span class="ru">Банки</span><span class="en">Jars</span></p>
  <div id="jars"></div>
  <p class="eyebrow"><span class="ru">Запас на год</span><span class="en">A year’s supply</span></p>
  <div id="years"></div>
  <p class="note"><span class="ru">Стекло. Доставка не входит в стоимость.</span><span class="en">Glass. Delivery is not included in the price.</span></p>
</main>

<main id="s2" hidden>
  <button class="back" id="back" type="button"><span class="ru">‹ К выбору</span><span class="en">‹ Back to the jars</span></button>
  <div class="sum" id="sum"></div>
  <label for="f-name"><span class="ru">Как к вам обращаться</span><span class="en">Your name</span></label>
  <input id="f-name" maxlength="120" autocomplete="name">
  <label for="f-place"><span class="ru">Страна и город</span><span class="en">Country and city</span></label>
  <input id="f-place" maxlength="160" autocomplete="address-level2">
  <label for="f-address"><span class="ru">Адрес доставки</span><span class="en">Delivery address</span></label>
  <textarea id="f-address" maxlength="300" autocomplete="street-address"></textarea>
  <label for="f-phone"><span class="ru">Телефон</span><span class="en">Phone</span></label>
  <input id="f-phone" maxlength="40" inputmode="tel" autocomplete="tel">
  <label for="f-comment"><span class="ru">Пожелания, если есть</span><span class="en">Notes, if any</span></label>
  <textarea id="f-comment" maxlength="300"></textarea>
  <div id="pmwrap" hidden>
    <label><span class="ru">Способ оплаты</span><span class="en">Payment method</span></label>
    <div class="pm" id="pm"></div>
  </div>
  <p class="note"><span class="ru">Доставку рассчитаем отдельно и назовём до её оплаты.</span><span class="en">Delivery is quoted separately before you pay for it.</span></p>
</main>

<div class="bar" id="bar">
  <div class="tt"><span><span class="ru">Итого</span><span class="en">Total</span></span><b id="total">$0</b></div>
  <button class="btn" id="go" type="button" disabled><span class="ru">Далее</span><span class="en">Next</span></button>
</div>

<script>
(function(){
  var tg=window.Telegram&&window.Telegram.WebApp,inTg=!!(tg&&tg.initData);
  var q=new URLSearchParams(location.search);
  var lang=q.get('lang')||((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code)||navigator.language||'en');
  lang=/^(ru|uk|be|kk|ky|uz|tg|hy|az)/i.test(lang)?'ru':'en';
  document.documentElement.lang=lang;
  var L=function(ru,en){return lang==='ru'?ru:en};
  if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0a0d0b');tg.setBackgroundColor('#0a0d0b')}catch(e){}}

  var P=[
    {sku:'j100',g:'jar',name:L('100 г','100 g'),note:L('Проба','Taster'),price:10,h:26},
    {sku:'j250',g:'jar',name:L('250 г','250 g'),note:L('На стол','Table'),price:20,h:38},
    {sku:'j500',g:'jar',name:L('500 г','500 g'),note:L('Домой','Home'),price:35,h:52},
    {sku:'y5',g:'year',name:L('5 кг','5 kg'),note:L('Для семьи','For a family'),price:300,h:30},
    {sku:'y10',g:'year',name:L('10 кг','10 kg'),note:L('Для семьи','For a family'),price:550,h:40},
    {sku:'y15',g:'year',name:L('15 кг','15 kg'),note:L('Для семьи','For a family'),price:750,h:52}
  ];
  var PM={crypto:L('Криптовалюта','Cryptocurrency'),swift:L('Международный банковский перевод','International bank transfer'),card:L('Карта банка РФ','Russian bank card'),link:L('Оплата по ссылке','Pay by link')};
  var methods=(q.get('pm')||'').split(',').filter(function(m){return PM[m]});
  var cart={},pay=methods.length===1?methods[0]:'',step=1;

  function jar(h){var w=Math.round(h*0.84);return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 42 50"><rect x="9" y="1.500" width="24" height="7" rx="1.500"/><path d="M11 8.500v3.500c-5 1.500-8 4.500-8 9.500v22c0 3 2 5 5 5h26c3 0 5-2 5-5v-22c0-5-3-8-8-9.500V8.500"/><path d="M6 24c5-2 10 2 15 0s10-2 15 0v18.500c0 2-1 3-3 3H9c-2 0-3-1-3-3z" fill="currentColor" fill-opacity=".22" stroke="none"/></svg>'}
  var MINI='<svg viewBox="0 0 15 19"><rect x="3" y="0" width="9" height="3" rx=".8"/><path d="M4 3.500C1.500 4.500 1 6 1 8v8c0 1.600 1 2.500 2.500 2.500h8c1.500 0 2.500-.900 2.500-2.500V8c0-2-.500-3.500-3-4.500z"/></svg>';

  function render(){
    ['jar','year'].forEach(function(g){
      var box=document.getElementById(g==='jar'?'jars':'years');box.innerHTML='';
      P.filter(function(p){return p.g===g}).forEach(function(p){
        var n=cart[p.sku]||0,r=document.createElement('div');r.className='row'+(n?' on':'');
        r.innerHTML='<div class="ico">'+jar(p.h)+'</div><div><div class="sz">'+p.name+'</div><div class="nt">'+p.note+'</div><div class="pr">$'+p.price+'</div></div>'+
          '<div class="step"><button type="button" data-d="-1" aria-label="-"'+(n?'':' disabled')+'>−</button><output>'+n+'</output><button type="button" data-d="1" aria-label="+"'+(n>=99?' disabled':'')+'>+</button></div>'+
          '<div class="minis">'+(g==='jar'?new Array(Math.min(n,24)+1).join(MINI):'')+'</div>';
        r.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){
          var v=(cart[p.sku]||0)+(+b.dataset.d);if(v<=0)delete cart[p.sku];else cart[p.sku]=Math.min(v,99);
          if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.selectionChanged()}catch(e){}}
          render()})});
        box.appendChild(r)})});
    update()}
  function total(){return P.reduce(function(s,p){return s+(cart[p.sku]||0)*p.price},0)}
  function update(){
    var t=total();document.getElementById('total').textContent='$'+t;
    var go=document.getElementById('go');go.disabled=!t;
    go.innerHTML=step===1?L('Далее','Next'):L('Оформить','Place order');
    document.getElementById('bar').hidden=false}
  function showStep(n){
    step=n;document.getElementById('s1').hidden=n!==1;document.getElementById('s2').hidden=n!==2;window.scrollTo(0,0);
    if(n===2){
      var h='';P.forEach(function(p){var c=cart[p.sku];if(c)h+='<div><span>'+p.name+' × '+c+'</span><span>$'+(c*p.price)+'</span></div>'});
      h+='<div class="t"><span>'+L('Итого','Total')+'</span><span>$'+total()+'</span></div>';
      document.getElementById('sum').innerHTML=h}
    if(tg&&tg.BackButton){try{n===2?tg.BackButton.show():tg.BackButton.hide()}catch(e){}}
    update()}
  var pmBox=document.getElementById('pm');
  if(methods.length){
    document.getElementById('pmwrap').hidden=false;
    methods.forEach(function(m){var b=document.createElement('button');b.type='button';b.textContent=PM[m];if(m===pay)b.className='on';
      b.addEventListener('click',function(){pay=m;pmBox.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)})});pmBox.appendChild(b)})}
  var u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(u&&u.first_name)document.getElementById('f-name').value=(u.first_name+' '+(u.last_name||'')).trim();

  function submit(){
    var ok=true,d={items:cart,lang:lang};
    [['name',1],['place',1],['address',1],['phone',1],['comment',0]].forEach(function(f){
      var el=document.getElementById('f-'+f[0]),v=el.value.trim();el.classList.toggle('bad',!!f[1]&&!v);if(f[1]&&!v)ok=false;if(v)d[f[0]]=v});
    if(!ok){var bad=document.querySelector('.bad');if(bad)bad.scrollIntoView({block:'center',behavior:'smooth'});
      if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred('error')}catch(e){}}return}
    if(pay)d.pay=pay;
    if(inTg){tg.sendData(JSON.stringify(d))}
    else{location.href='https://t.me/aksuu_honey_bot'}}
  document.getElementById('go').addEventListener('click',function(){step===1?showStep(2):submit()});
  document.getElementById('back').addEventListener('click',function(){showStep(1)});
  if(tg&&tg.BackButton){try{tg.BackButton.onClick(function(){showStep(1)})}catch(e){}}
  render();showStep(1);
})();
</script>
</html>
